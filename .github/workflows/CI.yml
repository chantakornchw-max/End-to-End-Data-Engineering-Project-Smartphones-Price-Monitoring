name: dbt_continuous_integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dbt_test_job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt-bigquery
        run: |
          pip install dbt-bigquery

      - name: Authenticate with GCP
        run: |
          echo "${{ secrets.GCP_GH_KEY }}" > ./gcp_key.json

      - name: Run dbt tests
        env:
          DBT_PROFILES_DIR: .
          DBT_SA_KEY_PATH: ../../gcp_key.json
        working-directory: dbt/dbt_transformation
        run: |
          dbt test --target dev